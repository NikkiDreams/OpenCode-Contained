services:
  opencode:
    image: ghcr.io/nikkidreams/opencode-contained:latest
    hostname: occontained
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      # Pin HOME/XDG so OpenCode resolves the mounted paths below; with `user:`
      # the host UID is usually not in the image's /etc/passwd, so HOME would
      # otherwise fall back to "/" and these mounts would never be read.
      HOME: /home/occontained
      XDG_CONFIG_HOME: /home/occontained/.config
      XDG_DATA_HOME: /home/occontained/.local/share
      GH_TOKEN: ${GH_TOKEN:-}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
    volumes:
      - ./:/workspace
      - ${HOME}/.ssh/id_ed25519:/home/occontained/.ssh/id_ed25519:ro
      - ${HOME}/.config/opencode:/home/occontained/.config/opencode
      - ${HOME}/.local/share/opencode/auth.json:/home/occontained/.local/share/opencode/auth.json
    network_mode: host
    command: [ "web", "--hostname", "0.0.0.0", "--port", "${OPENCODE_PORT:-4096}" ]
